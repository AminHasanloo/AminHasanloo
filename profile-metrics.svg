<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
  <title id="title">Amin Hasanloo public GitHub telemetry</title>
