<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">GitHub achievement quest log</title><desc id="desc">Pixel quest cards separating achievements already visible on the profile from authentic next goals.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080D1B"/><stop offset="1" stop-color="#21113C"/></linearGradient><style>.p{shape-rendering:crispEdges}.f{font-family:'Courier New',Consolas,monospace}.glow{animation:glow 1.8s steps(2,end) infinite}.lock{animation:lock 2.4s steps(2,end) infinite}@keyframes glow{50%{opacity:.55}}@keyframes lock{50%{transform:translateY(-3px)}}@media(prefers-reduced-motion:reduce){.glow,.lock{animation:none}}</style></defs>
  <g class="p"><rect width="1200" height="300" rx="14" fill="url(#bg)"/><rect x="2" y="2" width="1196" height="296" rx="12" fill="none" stroke="#334155" stroke-width="4"/>
    <text x="30" y="42" class="f" font-size="19" font-weight="900" fill="#FACC15">ACHIEVEMENT QUEST LOG</text><text x="875" y="42" class="f" font-size="11" fill="#94A3B8">REAL EVENTS UNLOCK REAL BADGES</text>
    <text x="32" y="76" class="f" font-size="12" font-weight="700" fill="#4ADE80">UNLOCKED ON PROFILE</text><text x="616" y="76" class="f" font-size="12" font-weight="700" fill="#C084FC">NEXT AUTHENTIC QUESTS</text>
    <g class="f" text-anchor="middle" font-weight="900">
      <g transform="translate(30 94)"><rect width="174" height="150" fill="#0B2B2B" stroke="#4ADE80" stroke-width="3"/><path d="M66 28h42v10h12v30h-12v10H66V68H54V38h12Z" fill="#22C55E"/><text x="87" y="60" font-size="22" fill="#ECFDF5">&lt;/&gt;</text><text x="87" y="108" font-size="12" fill="#DCFCE7">DEVELOPER</text><text x="87" y="127" font-size="12" fill="#DCFCE7">PROGRAM</text><text x="87" y="144" font-size="9" fill="#86EFAC">UNLOCKED</text></g>
      <g transform="translate(218 94)"><rect width="174" height="150" fill="#10243D" stroke="#22D3EE" stroke-width="3"/><path d="M48 58h72l-14 18H70Z" fill="#22D3EE"/><rect x="82" y="36" width="18" height="22" fill="#67E8F9"/><rect x="70" y="44" width="10" height="10" fill="#A5F3FC"/><text x="87" y="108" font-size="12" fill="#CFFAFE">PULL SHARK</text><text x="87" y="129" font-size="15" fill="#FACC15">x3</text><text x="87" y="144" font-size="9" fill="#67E8F9">UNLOCKED</text></g>
      <g transform="translate(406 94)"><rect width="174" height="150" fill="#35204D" stroke="#D946EF" stroke-width="3"/><path d="M62 34h50v12h12v34H50V46h12Z" fill="#A855F7"/><rect x="62" y="48" width="12" height="12" fill="#F5D0FE"/><rect x="100" y="48" width="12" height="12" fill="#F5D0FE"/><text x="87" y="108" font-size="12" fill="#FAE8FF">YOLO</text><text x="87" y="129" font-size="10" fill="#E9D5FF">MERGED BOLDLY</text><text x="87" y="144" font-size="9" fill="#F0ABFC">UNLOCKED</text></g>
      <g class="lock" transform="translate(616 94)"><rect width="174" height="150" fill="#17152A" stroke="#7C3AED" stroke-width="3" stroke-dasharray="8 6"/><rect x="66" y="34" width="42" height="42" fill="#6D28D9"/><rect x="56" y="46" width="62" height="18" fill="#8B5CF6"/><text x="87" y="108" font-size="12" fill="#DDD6FE">GALAXY BRAIN</text><text x="87" y="129" font-size="9" fill="#A78BFA">HELPFUL ANSWERS</text><text x="87" y="144" font-size="9" fill="#8B5CF6">LOCKED</text></g>
      <g class="lock" transform="translate(804 94)" style="animation-delay:.3s"><rect width="174" height="150" fill="#17152A" stroke="#0891B2" stroke-width="3" stroke-dasharray="8 6"/><path d="M58 46h26v16H58c-18 0-18-28 0-28h18M116 46H90v16h26c18 0 18-28 0-28H98" fill="none" stroke="#22D3EE" stroke-width="8"/><text x="87" y="108" font-size="11" fill="#CFFAFE">PAIR EXTRA</text><text x="87" y="129" font-size="9" fill="#67E8F9">REAL CO-AUTHORS</text><text x="87" y="144" font-size="9" fill="#0891B2">LOCKED</text></g>
      <g class="lock" transform="translate(992 94)" style="animation-delay:.6s"><rect width="174" height="150" fill="#17152A" stroke="#F59E0B" stroke-width="3" stroke-dasharray="8 6"/><path d="m87 28 10 22 24 2-18 16 6 24-22-12-22 12 6-24-18-16 24-2Z" fill="#FACC15" class="glow"/><text x="87" y="108" font-size="12" fill="#FEF3C7">STARSTRUCK</text><text x="87" y="129" font-size="9" fill="#FDE68A">USEFUL PUBLIC WORK</text><text x="87" y="144" font-size="9" fill="#D97706">LOCKED</text></g>
    </g>
    <text x="600" y="278" text-anchor="middle" class="f" font-size="10" fill="#64748B">PIXEL QUEST UI — OFFICIAL ACHIEVEMENTS STAY IN THE GITHUB SIDEBAR</text>
  </g>
</svg>
