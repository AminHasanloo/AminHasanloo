<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Amin Hasanloo development quest map</title><desc id="desc">An animated original pixel-art world map showing the path from architecture to shipping.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111F"/><stop offset="1" stop-color="#191035"/></linearGradient><style>.p{shape-rendering:crispEdges}.f{font-family:'Courier New',Consolas,monospace}.pulse{animation:pulse 1.5s steps(2,end) infinite}.water{animation:water 2s steps(2,end) infinite}@keyframes pulse{50%{opacity:.3}}@keyframes water{50%{transform:translateX(8px)}}@media(prefers-reduced-motion:reduce){.pulse,.water{animation:none}}</style></defs>
  <g class="p"><rect width="1200" height="280" rx="14" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="278" rx="13" fill="none" stroke="#334155" stroke-width="2"/>
    <text x="32" y="38" class="f" font-size="18" font-weight="900" fill="#FACC15">DEV QUEST MAP</text><text x="1000" y="38" class="f pulse" font-size="12" font-weight="700" fill="#4ADE80">● AUTO SAVE ON</text>
    <path d="M90 173H268V116h224v78h222v-92h220v70h170" fill="none" stroke="#334155" stroke-width="12"/><path d="M90 173H268V116h224v78h222v-92h220v70h170" fill="none" stroke="#FACC15" stroke-width="4" stroke-dasharray="10 14"/>
    <g class="f" font-size="11" font-weight="900" text-anchor="middle">
      <g transform="translate(90 118)"><rect x="-42" y="-30" width="84" height="52" fill="#0E7490" stroke="#22D3EE" stroke-width="3"/><rect x="-26" y="-46" width="52" height="16" fill="#155E75"/><text y="-2" fill="#ECFEFF">ARCH</text><text y="76" fill="#A5F3FC">DESIGN</text></g>
      <g transform="translate(300 72)"><rect x="-38" y="-24" width="76" height="48" fill="#3730A3" stroke="#818CF8" stroke-width="3"/><text y="5" fill="#E0E7FF">C#</text><text y="70" fill="#C7D2FE">BUILD</text></g>
      <g transform="translate(506 148)"><rect x="-42" y="-28" width="84" height="56" fill="#166534" stroke="#4ADE80" stroke-width="3"/><text y="5" fill="#DCFCE7">TEST</text><text y="75" fill="#BBF7D0">VERIFY</text></g>
      <g transform="translate(728 58)"><rect x="-40" y="-22" width="80" height="44" fill="#9A3412" stroke="#FB923C" stroke-width="3"/><rect x="-24" y="-38" width="48" height="16" fill="#C2410C"/><text y="5" fill="#FFEDD5">PLAY</text><text y="76" fill="#FED7AA">POLISH</text></g>
      <g transform="translate(952 126)"><rect x="-44" y="-28" width="88" height="56" fill="#6B21A8" stroke="#D946EF" stroke-width="3"/><text y="5" fill="#FAE8FF">DOCS</text><text y="73" fill="#F5D0FE">EXPLAIN</text></g>
      <g transform="translate(1120 118)"><path d="M0-48 34-8 18-8 18 32H-18V-8H-34Z" fill="#B45309" stroke="#FACC15" stroke-width="3"/><text y="2" fill="#FFF7AE">↑</text><text y="76" fill="#FDE68A">SHIP</text></g>
    </g>
    <path d="M74 226H1126" fill="none" stroke="#1E3A5F" stroke-width="4" stroke-dasharray="8 12"/>
    <g aria-hidden="true"><g><rect x="-9" y="-9" width="18" height="18" fill="#22D3EE"/><rect x="-5" y="-16" width="10" height="7" fill="#A5F3FC"/></g><animateMotion dur="11s" repeatCount="indefinite" path="M74 226H1126"/></g>
    <g class="water" fill="#0E7490"><rect x="20" y="248" width="260" height="8"/><rect x="300" y="256" width="250" height="8"/><rect x="570" y="248" width="260" height="8"/><rect x="850" y="256" width="330" height="8"/></g>
  </g>
</svg>
